[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hass-axi"
version = "0.10.0"
description = "Agent eXperience Interface (AXI) CLI for Home Assistant: entity, area and device registry administration over the WebSocket API, and service calls that explain their refusals"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["home-assistant", "home-automation", "cli", "axi", "agent", "registry", "websocket", "toon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
dependencies = [
  "axi-toolkit>=0.4.2",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pyyaml>=6",
  "ruff>=0.5",
  # An independent TOON decoder, so "the output round-trips" is checked by
  # something other than the encoder under test. Pinned: it is a second
  # opinion, and a second opinion that moves is not one. Both this and
  # hypothesis need Python 3.10; the tests that use them skip on 3.9.
  "toon-format==1.0.0; python_version >= '3.10'",
  "hypothesis>=6.100; python_version >= '3.10'",
]

[project.scripts]
hass-axi = "hass_axi.entry:main"

[project.urls]
Homepage = "https://github.com/dmealing/hass-axi"
Source = "https://github.com/dmealing/hass-axi"

[tool.hatch.build.targets.wheel]
packages = ["src/hass_axi"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF001"]
# The folding table is made of the characters it folds.
"src/hass_axi/toolkit/names.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live suite under tests/live/ talks to a real Home Assistant and is opt-in
# twice over: deselected here, and skipped without HASS_AXI_LIVE=1. Run it with
# scripts/live-test.sh, never from CI.
addopts = "-q -m 'not live'"
markers = [
  "live: talks to a real Home Assistant; deselected by default, run by scripts/live-test.sh",
]
filterwarnings = ["error::DeprecationWarning:hass_axi.*"]
