# Local CI — the heavy validation matrix, on the maintainer's self-hosted runner.
#
# SECURITY (public repository + self-hosted runner): this workflow must NEVER
# gain a `pull_request` trigger. The runner is the maintainer's own workstation,
# and a job on it executes repository code as a real user with that user's files
# and network. Every trigger below is reachable only by someone who already has
# write access — a push to `main`, the schedule, or a manual dispatch — so
# fork-submitted code cannot reach the machine. `pull_request` would hand any
# contributor on the internet code execution on it, in one line and with no
# other visible symptom. Add coverage for pull requests in `hygiene.yml`, which
# is GitHub-hosted, or not at all.
#
# WHERE VALIDATION ACTUALLY HAPPENS: every change here goes through the local
# no-mistakes gate — review, tests, lint, docs — before a PR is ever opened.
# GitHub-hosted CI is not the primary quality signal for this repository and
# should not be treated as one, which is why a pull request shows a single cheap
# check (the leak scan, the one gate that must run before a human reads a diff)
# rather than a matrix. This workflow is the full matrix; it runs on `main`,
# nightly, and on demand.
#
# It also replaces a genuinely wasteful arrangement: this file used to trigger on
# both `push: branches: ["**"]` and `pull_request`, so every PR branch ran the
# whole matrix twice against identical commits. One copy went green while its
# twin sat queued for over an hour, leaving the PR permanently "unstable".
#
# Every check is a section of `scripts/ci-local.sh`, which the no-mistakes gate
# also runs; each job here only schedules one section on the runner. GitHub
# Actions is currently disabled on this repository, so today the script and the
# gate are the only things that run these checks.
#
# The filename stays `ci.yml` on purpose. `workflow_dispatch` resolves a workflow
# only if the file is already on the default branch, so a renamed file could not
# have been dispatched on its own branch — and this workflow was verified end to
# end on the runner before it merged, which is the whole point of it.
name: ci (self-hosted)

on:
  push:
    branches: [main]
  # Nightly. Deliberately not 08:17 UTC: a sibling project's self-hosted
  # workflow holds that slot on the same workstation.
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leakcheck:
    name: leak check
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace on a self-hosted runner outlives the job; do not leave
          # a credential behind in its .git/config.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --demo first: prove the scanner still detects what it claims to before
      # trusting its scan of every tracked file.
      - run: scripts/ci-local.sh --only leakcheck
  # A commit message release-please cannot parse is dropped from the changelog
  # and the version bump while the release workflow exits 0. `release.yml` fails
  # on that too, but it only runs on `main`; here it also runs nightly, so an
  # allowance that has outlived its cause surfaces without waiting for a merge.
  commits:
    name: commit messages are readable
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    permissions:
      contents: read
      # A pull request body can replace a commit message entirely, so the audit
      # reads it. Read-only.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the checker, then audit every commit since the last release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci-local.sh --only commits

  # EVERY job that needs third-party packages installs into a fresh `.venv` and
  # calls the tools by path out of it. That is not ceremony. This runner runs as
  # the maintainer's own user, so `~/.local/lib/python3.X/site-packages` and
  # `~/.local/bin` are on the interpreter's path and ahead of it on `PATH` — a
  # bare `pytest`, `ruff` or `hass-axi` resolves to whatever the maintainer happens
  # to have installed, against `/usr/bin/python3.X` rather than the interpreter
  # this job set up. First run of this workflow proved it in both directions:
  # py3.9 and py3.12 passed (no user site exists for those versions) while py3.10
  # and py3.11 died with `ModuleNotFoundError: No module named 'hass_axi'`, and the
  # lint and skill jobs went green having run the maintainer's own binaries
  # against the maintainer's own checkout. A venv excludes the user site by
  # construction, so a job sees only what it just installed.
  lint:
    name: lint
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --clear because the workspace outlives the job on a self-hosted runner.
      - run: python -m venv --clear .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/pip install -e ".[dev]"
      - run: scripts/ci-local.sh --only lint

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner's host provides only some of these; setup-python downloads
      # the rest into the persistent tool cache, so only the first run pays.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `tests/test_commit_message.py` compares this repository's transcription
      # of the conventional-commits grammar against the vendored upstream parser,
      # and *skips* that comparison where `node` is absent. A skipped agreement
      # check reads exactly like a passing one, so the interpreter is installed
      # here rather than hoped for.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m venv --clear .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/pip install -e ".[dev]"
      - run: scripts/ci-local.sh --only test

  skill:
    name: skill is current
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv --clear .venv
      - run: .venv/bin/python -m pip install --upgrade pip
      - run: .venv/bin/pip install -e ".[dev]"
      # The committed skill is generated from the CLI's own command table — from
      # THIS checkout's, which is why the script calls the venv's `hass-axi` and
      # not `PATH`'s.
      - run: scripts/ci-local.sh --only skill

  model:
    name: model is current
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The generated files are committed; this regenerates them from the model
      # and fails on a difference. The toolchain runs under `uvx`, so it needs
      # `uv` on the runner and nothing in a virtualenv.
      - uses: astral-sh/setup-uv@v6
      - run: scripts/ci-local.sh --only model

  # Nothing watches a workflow that runs on main and overnight, so a failure has
  # to come and find someone.
  notify:
    needs: [leakcheck, commits, lint, test, skill, model]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - env:
          # env-indirection: a commit message is untrusted text and must never be
          # interpolated with ${{ }} directly into a script body.
          HEAD_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          notify-send -u critical "ci FAILED: hass-axi" \
            "$(printf '%s' "$HEAD_MSG" | head -n1)
          $RUN_URL" || echo "notify-send unavailable; GitHub email still fires"
